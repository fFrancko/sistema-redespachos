name: Deploy to Dev

on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to qx-redespachos-dev
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # MVP-31 (P-05): el deploy se activa con la variable de repositorio DEPLOY_ENABLED.
      # Activado y sin secrets, el job falla; desactivado, el resumen del run lo dice.
      - name: Check deploy config
        id: deploy_config
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy a dev desactivado"
              echo ""
              echo "La variable de repositorio \`DEPLOY_ENABLED\` vale \`${DEPLOY_ENABLED:-(sin definir)}\`, no \`true\`."
              echo "Este run valida lint, typecheck, test y build, pero **no despliega** a \`qx-redespachos-dev\`:"
              echo "los pasos de autenticación y deploy figuran como omitidos. Ver \`docs/CI.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy desactivado::DEPLOY_ENABLED no es 'true'; no se despliega a qx-redespachos-dev."
            exit 0
          fi
          missing=""
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]; then missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"; fi
          if [ -z "$GCP_SERVICE_ACCOUNT_EMAIL" ]; then missing="$missing GCP_SERVICE_ACCOUNT_EMAIL"; fi
          if [ -n "$missing" ]; then
            {
              echo "## Deploy a dev fallido: faltan secrets"
              echo ""
              echo "\`DEPLOY_ENABLED\` vale \`true\` pero faltan los secrets:${missing}."
              echo "Cargalos en Settings > Secrets and variables > Actions, o desactivá \`DEPLOY_ENABLED\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Faltan secrets de deploy::DEPLOY_ENABLED es 'true' pero faltan:${missing}. Cargalos o desactivá DEPLOY_ENABLED."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @sistema-redespachos/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (Firebase emulators)
        run: pnpm exec firebase emulators:exec --only auth,firestore --project demo-qx-ci "pnpm test"
        env:
          CI: "true"

      - name: Build
        run: pnpm build

      - name: Authenticate to Google Cloud
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # Solo Functions (P-3): el target de Hosting `web` todavía no está mapeado en .firebaserc.
      # El predeploy de firebase.json construye shared y functions y arma apps/functions/dist.
      - name: Deploy Functions
        if: steps.deploy_config.outputs.enabled == 'true'
        run: pnpm exec firebase deploy --project qx-redespachos-dev --only functions --non-interactive
